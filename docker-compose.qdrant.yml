# Optional Qdrant overlay — NOT part of the default stack.
#
# The Qdrant retriever ships unverified (see PLAN.md, Phase 5). To try it:
#
#   pip install -e ".[qdrant]"
#   docker compose -f docker-compose.yml -f docker-compose.qdrant.yml up -d
#   # then set VECTOR_STORE=qdrant in .env

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
