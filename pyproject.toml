[project]
name = "multi-agent-rag-support-bot"
version = "0.1.0"
description = "Self-hostable, domain-agnostic multi-agent RAG support bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    # Orchestration & chains
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    # LLM
    "anthropic>=0.40",
    # Vector store (default backend) + database
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # Ingestion
    "pypdf>=5.0",
    # Observability. v4 only: the OTEL-based client (`propagate_attributes`,
    # `start_as_current_observation`) has no equivalent in v2/v3. Its LangChain
    # integration also imports `langchain` itself, not just `langchain-core`.
    "langfuse>=4.0",
    # Config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Qdrant adapter ships unverified and is not installed by default — see PLAN.md.
qdrant = ["qdrant-client>=1.12"]
# Only needed when AUTH_MODE=jwt.
jwt = ["python-jose[cryptography]>=3.3"]
# Evaluation harness (Phase 13); heavy, kept out of the runtime install.
evals = ["ragas>=0.2", "datasets>=3.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in an argument default; B008
# flags it, but it is correct usage here.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["live: talks to a real Ollama/Claude backend (deselect with -m 'not live')"]
