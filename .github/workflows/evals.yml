name: Evals

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a drifting model or a broken dataset is caught even when
    # nothing has been merged.
    - cron: "17 4 * * 1"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ragas:
    name: RAGAS golden dataset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Same image as docker-compose.yml, so CI and local use one schema path.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ragbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The pipeline and the judge run on Claude: a 12B local model takes ~50
      # minutes for the same dataset (see PLAN.md Phase 13), which is not a
      # per-PR budget. Embeddings have no hosted provider in this project, so
      # Ollama is still installed — for `nomic-embed-text` only, which is small
      # enough to run on a CPU runner.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: claude
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIM: "768"
      OLLAMA_BASE_URL: http://localhost:11434
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ragbot
      VECTOR_STORE: pgvector
      AUTH_MODE: local
      REPORT: evals/reports/ragas-ci.json

    steps:
      - uses: actions/checkout@v5

      - name: Check for an API key
        id: guard
        # A fork PR has no access to secrets. Report that plainly instead of
        # failing with a confusing 401 halfway through the run.
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not available; skipping the eval run."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: pip install -e ".[evals]"

      - name: Create the schema
        if: steps.guard.outputs.run == 'true'
        # The same init script Compose runs, so CI cannot drift from local.
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: ragbot
        run: bash docker/postgres/init/01-init.sh

      - name: Start Ollama (embeddings only)
        if: steps.guard.outputs.run == 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 2
          done
          ollama pull "$EMBEDDING_MODEL"

      - name: Index the fixture corpus and score the golden dataset
        if: steps.guard.outputs.run == 'true'
        # Indexing is part of the run: --skip-index is for local iteration, and
        # a corpus that fails to index must fail the build, not be assumed.
        run: |
          python -m evals.run_ragas \
            --provider claude --judge-provider claude \
            --concurrency 6 \
            --min-faithfulness 0.85 \
            --min-context-recall 0.60 \
            --min-source-accuracy 0.80 \
            --min-refusal-rate 0.80 \
            --report "$REPORT"

      - name: Upload the report
        # Always: a failed run is exactly when the per-question scores matter.
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ragas-report
          path: ${{ env.REPORT }}
          if-no-files-found: warn
