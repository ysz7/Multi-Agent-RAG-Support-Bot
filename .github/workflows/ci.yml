name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: pip install "ruff>=0.7"
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # jwt and evals are needed by the offline tests: they cover the token
        # path and the RAGAS judge bridge. No backends are involved.
        run: pip install -e ".[dev,jwt,evals]"
      - name: Run the offline suite
        # `live` talks to a real model, a real database, or both; those run in
        # the evals workflow, which has the services to back them.
        run: pytest -q -m "not live"
